[package]
name = "declare_gpu_engine"
version = "0.0.0"
edition = "2024"
publish = false
description = "The render=gpu engine: fonts, shaping and measuring (Parley), drawing (Vello on WebGPU)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "ImageBitmap"] }
vello = { version = "0.11", default-features = false, features = ["wgpu"] }
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
parley = { version = "0.12", default-features = false, features = ["std"] }
skrifa = "0.44"
wuff = "0.2"
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Vello with one fix (vendor/vello/src/render.rs, marked "(declare)"): a render whose scene
# has no images replaced the persistent image atlas with a 1×1 one, so the images of the
# next render drew blank. A frame here is several renders, and some have no images.
[patch.crates-io]
vello = { path = "vendor/vello" }
